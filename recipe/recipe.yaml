context:
  name: polars-ds
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/polars_ds-${{ version }}.tar.gz
  sha256: c45673eafadc5023354b0a197aa7bb66f578774db3c9deb17195374638bd2a53
  patches:
    - patches/update-ethnum.patch

build:
  number: 0
  script:
    - python -m pip install . -vv
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.7.4,<2.0
    - pip
  run:
    - python
    - polars >=1.4.0,!=1.25,!=1.26,!=1.32.1,!=1.32.2
    - if: python < "3.12"
      then:
        - typing-extensions

tests:
  - python:
      imports:
        - polars_ds
      pip_check: true

about:
  homepage: https://github.com/abstractqqq/polars_ds_extension
  documentation: https://polars-ds-extension.readthedocs.io/
  summary: Polars extension for general data science use cases
  license: MIT
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - abstractqqq
    - thewchan
    - xhochy
